[package]
name = "websocket-playground"
version = "0.1.0"
edition = "2021"

[dependencies]
# this is the development version of Yew
yew = { git = "https://github.com/yewstack/yew/", features = ["csr"] }
web-sys = { version = "0.3.98", features = ["HtmlSelectElement", "KeyboardEvent", "FocusEvent"] }
gloo-net = { version = "0.7.0", features = ["websocket"] }
futures-util = "0.3.31"
futures = "0.3.32"
serde_json = { version = "1.0", features = ["alloc"] }
